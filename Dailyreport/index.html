<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報データ抽出ツール</title>
  <link rel="icon" href="../assets/icons/kokeshi.png" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'メイリオ', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    
    .header p {
      opacity: 0.9;
      font-size: 14px;
    }
    
    .content {
      padding: 30px;
    }
    
    .drop-zone {
      border: 3px dashed #667eea;
      border-radius: 12px;
      padding: 60px 20px;
      text-align: center;
      background: #f8f9ff;
      transition: all 0.3s ease;
      cursor: pointer;
      margin-bottom: 30px;
    }
    
    .drop-zone:hover, .drop-zone.drag-over {
      background: #eef0ff;
      border-color: #764ba2;
      transform: scale(1.02);
    }
    
    .drop-zone-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
    
    .drop-zone-text {
      font-size: 18px;
      color: #667eea;
      font-weight: bold;
      margin-bottom: 10px;
    }
    
    .drop-zone-subtext {
      font-size: 14px;
      color: #666;
    }
    
    .status {
      background: #f0f4f8;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #333;
    }
    
    .status strong {
      color: #667eea;
    }

    .warn-item {
      margin-top: 8px;
      color: #c0392b;
      font-weight: bold;
      background: #fdecea;
      border-left: 4px solid #e74c3c;
      padding: 6px 10px;
      border-radius: 4px;
    }

    .error-box {
      background: #fdecea;
      border: 2px solid #e74c3c;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .error-box-title {
      color: #c0392b;
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .error-item {
      background: white;
      border-left: 4px solid #e74c3c;
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 4px;
      font-size: 13px;
      color: #333;
    }

    .error-item:last-child {
      margin-bottom: 0;
    }
    
    .table-container {
      max-height: 400px;
      overflow: auto;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    
    thead {
      background: #667eea;
      color: white;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }
    
    th {
      font-weight: bold;
    }
    
    tbody tr:hover {
      background: #f8f9ff;
    }
    
    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    
    button {
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-export {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-export:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    
    .btn-clear {
      background: #f44336;
      color: white;
    }
    
    .btn-clear:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 日報データ抽出ツール</h1>
      <p>Excelファイルをドラッグ&ドロップして、W/C・工番・合計を抽出（全角→半角自動変換対応）</p>
    </div>
    
    <div class="content">
      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">📁</div>
        <div class="drop-zone-text">ここにExcelファイルをドロップ</div>
        <div class="drop-zone-subtext">または、クリックしてファイルを選択</div>
        <input type="file" id="fileInput" accept=".xlsx,.xls" style="display: none;" multiple>
      </div>
      
      <div class="status" id="status">
        処理済みファイル: <strong>0</strong> 件 | 抽出データ: <strong>0</strong> 行
        <div class="warn-item">⚠️ 読み込み後、0件のファイルがないか確認してください</div>
      </div>

      <div class="error-box" id="errorBox" style="display: none;">
        <div class="error-box-title">🚨 合計の計算式が消えている行があります</div>
        <div id="errorList"></div>
      </div>
      
      <div class="table-container">
        <table id="dataTable">
          <thead>
            <tr>
              <th>W/C</th>
              <th>工番</th>
              <th>合計</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="3" class="empty-state">
                データがありません。<br>Excelファイルをドロップして開始してください。
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <div class="buttons">
        <button class="btn-export" id="exportBtn" disabled>CSVに出力</button>
        <button class="btn-clear" id="clearBtn" disabled>データをクリア</button>
      </div>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const tableBody = document.getElementById('tableBody');
    const status = document.getElementById('status');
    const errorBox = document.getElementById('errorBox');
    const errorList = document.getElementById('errorList');
    const exportBtn = document.getElementById('exportBtn');
    const clearBtn = document.getElementById('clearBtn');
    
    let extractedData = [];
    let extractedErrors = [];
    let fileCount = 0;
    let fileResults = [];

    const HEADER_ROW = 5;     // 6行目（0始まり）に「合計」の文字がある想定
    const KOBAN_COL_START = 1; // B列
    const KOBAN_COL_END = 3;   // D列
    const DATA_START_ROW = 6;  // 7行目からデータ開始
    const HOUR_COL_START = 4;  // E列（工数が入り得る最初の列）

    // 全角英数字を半角に変換する関数
    function toHalfWidth(str) {
      if (!str) return str;
      return String(str).replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
        return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
      });
    }

    // セルの文字列からスペース（半角・全角・タブ）を除去して比較用に正規化
    function normalizeLabel(v) {
      return String(v).replace(/[\s\u3000]/g, '');
    }

    // 6行目を走査して「合計」列を探す（"合計"/"合 計"/"合　計" などの表記ゆれに対応）
    function findTotalColumn(sheet, range) {
      for (let col = 0; col <= range.e.c; col++) {
        const cell = sheet[XLSX.utils.encode_cell({ r: HEADER_ROW, c: col })];
        if (cell && cell.v !== undefined && cell.v !== null) {
          if (normalizeLabel(cell.v) === '合計') {
            return col;
          }
        }
      }
      return null; // 見つからなければフォールバック
    }

    // ドラッグ&ドロップイベント
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const files = Array.from(e.dataTransfer.files).filter(f => 
        f.name.endsWith('.xlsx') || f.name.endsWith('.xls')
      );
      if (files.length > 0) {
        processFiles(files);
      }
    });

    dropZone.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        processFiles(Array.from(e.target.files));
      }
    });

    async function processFiles(files) {
      for (const file of files) {
        await processFile(file);
      }
    }

    function processFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            
            const beforeCount = extractedData.length;
            extractDataFromSheet(firstSheet, file.name);
            const afterCount = extractedData.length;
            fileResults.push({ name: file.name, count: afterCount - beforeCount });
            fileCount++;
            updateUI();
            resolve();
          } catch (error) {
            console.error('ファイル処理エラー:', error);
            alert(`ファイル ${file.name} の処理中にエラーが発生しました。`);
            resolve();
          }
        };
        
        reader.readAsArrayBuffer(file);
      });
    }

    function extractDataFromSheet(sheet, fileName) {
      const range = XLSX.utils.decode_range(sheet['!ref']);
      const totalCol = findTotalColumn(sheet, range);

      for (let row = DATA_START_ROW; row <= range.e.r; row++) {
        const wcCell = sheet[XLSX.utils.encode_cell({ r: row, c: 0 })]; // A列

        if (!wcCell || !wcCell.v) continue;

        const wc = toHalfWidth(String(wcCell.v).trim());
        if (!wc || wc === 'W/C') continue; // ヘッダー行をスキップ

        // 工番を取得 (B～D列の結合セル)
        let koban = '';
        for (let col = KOBAN_COL_START; col <= KOBAN_COL_END; col++) {
          const cell = sheet[XLSX.utils.encode_cell({ r: row, c: col })];
          if (cell && cell.v) {
            koban = toHalfWidth(String(cell.v).trim());
            break;
          }
        }

        if (!koban) continue;

        if (totalCol === null) {
          // 「合計」の文字が見つからない場合のフォールバック（従来ロジック）
          let total = null;
          for (let col = HOUR_COL_START; col <= range.e.c; col++) {
            const cell = sheet[XLSX.utils.encode_cell({ r: row, c: col })];
            if (cell && cell.v !== undefined && cell.v !== null && cell.v !== '') {
              const value = typeof cell.v === 'number' ? cell.v : parseFloat(cell.v);
              if (!isNaN(value) && value > 0) {
                total = value;
              }
            }
          }
          if (total === null || total === 0) continue;
          extractedData.push({ wc, koban, total });
          continue;
        }

        // 工数の有無をチェック（E列～合計列の手前まで）
        let hasHours = false;
        for (let col = HOUR_COL_START; col < totalCol; col++) {
          const cell = sheet[XLSX.utils.encode_cell({ r: row, c: col })];
          if (cell && cell.v !== undefined && cell.v !== null && cell.v !== '') {
            const value = typeof cell.v === 'number' ? cell.v : parseFloat(cell.v);
            if (!isNaN(value) && value > 0) {
              hasHours = true;
              break;
            }
          }
        }

        // 合計列の値を取得
        const totalCell = sheet[XLSX.utils.encode_cell({ r: row, c: totalCol })];
        let total = null;
        if (totalCell && totalCell.v !== undefined && totalCell.v !== null && totalCell.v !== '') {
          const value = typeof totalCell.v === 'number' ? totalCell.v : parseFloat(totalCell.v);
          if (!isNaN(value) && value > 0) total = value;
        }

        if (hasHours && total === null) {
          // 工数はあるのに合計が空欄 → エラー行として記録
          extractedErrors.push({
            file: fileName,
            row: row + 1, // Excel上の行番号（1始まり）
            wc: wc,
            koban: koban
          });
          continue;
        }

        if (total === null) continue; // 工数も合計もない行はスキップ

        extractedData.push({ wc, koban, total });
      }
    }

    function updateUI() {
      // ステータス更新
      const zeroFiles = fileResults.filter(f => f.count === 0);
      const warningHtml = zeroFiles.map(f => 
        `<div class="warn-item">⚠️ ${f.name}：0件注意</div>`
      ).join('');
      status.innerHTML = `処理済みファイル: <strong>${fileCount}</strong> 件 | 抽出データ: <strong>${extractedData.length}</strong> 行  ${warningHtml}`;

      // エラー一覧更新
      if (extractedErrors.length > 0) {
        errorBox.style.display = 'block';
        errorList.innerHTML = extractedErrors.map(err =>
          `<div class="error-item">📄 ${err.file}　${err.row}行目　W/C: ${err.wc}　工番: ${err.koban}　→ 工数はありますが合計が空欄です</div>`
        ).join('');
      } else {
        errorBox.style.display = 'none';
        errorList.innerHTML = '';
      }
      
      // テーブル更新
      if (extractedData.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="3" class="empty-state">
              データがありません。<br>Excelファイルをドロップして開始してください。
            </td>
          </tr>
        `;
        exportBtn.disabled = true;
        clearBtn.disabled = true;
      } else {
        tableBody.innerHTML = extractedData.map(item => `
          <tr>
            <td>${item.wc}</td>
            <td>${item.koban}</td>
            <td>${item.total}</td>
          </tr>
        `).join('');
        exportBtn.disabled = false;
        clearBtn.disabled = false;
      }
    }


    exportBtn.addEventListener('click', () => {
      if (extractedData.length === 0) return;

      if (extractedErrors.length > 0) {
        const proceed = confirm(`合計が空欄のエラー行が ${extractedErrors.length} 件あります。このまま出力しますか？`);
        if (!proceed) return;
      }
      
      const now = new Date();
      const dateStr = `${now.getFullYear()}年${String(now.getMonth() + 1).padStart(2, '0')}月${String(now.getDate()).padStart(2, '0')}日`;
      
      // CSVデータを作成（ヘッダーなし）
      const csvContent = extractedData.map(item => 
        `${item.wc},${item.koban},${item.total}`
      ).join('\n');
      
      // BOM付きでダウンロード（Excelで正しく開けるように）
      const bom = '\uFEFF';
      const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `日報まとめ_${dateStr}_.csv`;
      link.click();
      URL.revokeObjectURL(link.href);
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('すべてのデータをクリアしますか?')) {
        extractedData = [];
        extractedErrors = [];
        fileCount = 0;
        fileResults = [];
        updateUI();
      }
    });
  </script>
</body>
</html>
