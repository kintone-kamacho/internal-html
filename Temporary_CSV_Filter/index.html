<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大物確認用仮入庫データ抽出</title>
  <link rel="icon" href="../assets/icons/daruma.png" type="image/png">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      margin: 40px;
      background: #f7f7f7;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
      color: #333;
    }

    .note {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #856404;
    }

    #dropZone {
      border: 2px dashed #aaa;
      border-radius: 6px;
      padding: 40px;
      text-align: center;
      margin-bottom: 20px;
      color: #999;
      cursor: pointer;
      transition: all 0.3s;
    }

    #dropZone.hover {
      border-color: #0366d6;
      background: #f0f8ff;
      color: #0366d6;
    }

    #dropZone.has-file {
      border-color: #28a745;
      background: #f0fff4;
      color: #28a745;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #333;
    }

    input[type="date"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #0366d6;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #0256c4;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 4px;
      display: none;
    }

    #message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    #message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    #message.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      display: block;
    }

    .stats {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 大物確認用仮入庫データ抽出</h1>
    
    <div class="note">
      <strong>抽出条件:</strong><br>
      • 工番: 先頭2文字に「K」を含まないもの<br>
      • 期間: 指定した開始日〜終了日の範囲内（納期または回答納期）
    </div>

    <div id="dropZone">
      📁 CSVファイルをドラッグ＆ドロップ<br>
      <small>またはクリックしてファイルを選択</small>
    </div>
    <input type="file" id="fileInput" accept=".csv" style="display:none">

    <div class="form-group">
      <label for="startDate">開始日:</label>
      <input type="date" id="startDate" required>
    </div>

    <div class="form-group">
      <label for="endDate">終了日:</label>
      <input type="date" id="endDate" required>
    </div>

    <button id="processBtn" onclick="processFile()">抽出してダウンロード</button>

    <div id="message"></div>
  </div>

  <script>
    let fileData = null;
    let fileName = '';
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const messageDiv = document.getElementById('message');

    // ドラッグ＆ドロップイベント
    dropZone.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('hover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('hover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('hover');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    });

    function handleFile(file) {
      if (!file.name.endsWith('.csv')) {
        showMessage('CSVファイルを選択してください', 'error');
        return;
      }

      fileName = file.name;
      const reader = new FileReader();
      
      reader.onload = (e) => {
        fileData = e.target.result;
        dropZone.classList.add('has-file');
        dropZone.innerHTML = `✓ ${fileName}<br><small>ファイルが読み込まれました</small>`;
        showMessage('', '');
      };

      reader.readAsText(file, 'Shift_JIS');
    }

    function showMessage(msg, type) {
      messageDiv.textContent = msg;
      messageDiv.className = type;
      if (!msg) messageDiv.style.display = 'none';
    }

    // BOM除去・正規化・トリム
    function normalizeText(raw) {
      if (raw === undefined || raw === null) return "";
      let s = String(raw);
      s = s.replace(/^\uFEFF/, ""); // BOM除去
      if (typeof s.normalize === "function") s = s.normalize("NFKC");
      return s.trim();
    }

    // 工番が有効か（先頭2文字にKを含まない）
    function isValidKbnCode(raw) {
      const s = normalizeText(raw).toUpperCase();
      if (!s) return false;
      const prefix = s.slice(0, 2);
      return !prefix.includes("K");
    }

    // 日付パース（YYYY/MM/DD または YYYY-MM-DD）
    function parseDate(value) {
      if (!value) return null;
      if (value instanceof Date) return value;

      let s = normalizeText(String(value));
      const m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      
      if (m) {
        const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
        return new Date(y, mo - 1, d);
      }

      const alt = new Date(s);
      return isNaN(alt.getTime()) ? null : alt;
    }

    // 期間判定
    function isWithinPeriod(cDate, dDate, startDate, endDate) {
      if (!startDate || !endDate) return false;

      // 回答納期があればそれを優先
      if (dDate instanceof Date && !isNaN(dDate.getTime())) {
        return (dDate >= startDate && dDate <= endDate);
      }

      // 回答納期がなければ納期を見る
      if (cDate instanceof Date && !isNaN(cDate.getTime())) {
        return (cDate >= startDate && cDate <= endDate);
      }

      return false;
    }

    // CSVパース（シンプル版）
    function parseCSV(text) {
      const lines = text.split(/\r?\n/);
      const result = [];
      
      for (let line of lines) {
        if (!line.trim()) continue;
        
        // カンマ区切りでパース（ダブルクォート内のカンマは無視）
        const row = [];
        let inQuotes = false;
        let currentCell = '';
        
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(currentCell);
            currentCell = '';
          } else {
            currentCell += char;
          }
        }
        row.push(currentCell);
        result.push(row);
      }
      
      return result;
    }

    // CSV生成
    function generateCSV(rows) {
      return rows.map(row => {
        return row.map(cell => {
          const s = String(cell || '');
          // カンマ、改行、ダブルクォートを含む場合はクォートで囲む
          if (s.includes(',') || s.includes('\n') || s.includes('"')) {
            return '"' + s.replace(/"/g, '""') + '"';
          }
          return s;
        }).join(',');
      }).join('\n');
    }

    // ファイルダウンロード
    function downloadCSV(csvContent, filename) {
      const bom = '\uFEFF';
      const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // メイン処理
    function processFile() {
      const startDateStr = document.getElementById('startDate').value;
      const endDateStr = document.getElementById('endDate').value;

      if (!fileData) {
        showMessage('CSVファイルを選択してください', 'error');
        return;
      }

      if (!startDateStr || !endDateStr) {
        showMessage('開始日と終了日を入力してください', 'error');
        return;
      }

      showMessage('処理中...', 'info');

      try {
        // 日付パース
        const startDate = parseDate(startDateStr);
        const endDate = parseDate(endDateStr);

        if (!startDate || !endDate) {
          throw new Error('日付の形式が正しくありません');
        }

        // CSV パース
        const csvText = normalizeText(fileData);
        const data = parseCSV(csvText);

        if (!data || data.length === 0) {
          throw new Error('CSVの内容が読み取れませんでした');
        }

        // ヘッダー
        const header = data[0];
        
        // フィルタリング
        const filtered = [];
        for (let i = 1; i < data.length; i++) {
          const row = data[i];
          if (row.length < 4) continue; // 最低限の列数チェック

          const rawA = row[0]; // 工番
          const codeOk = isValidKbnCode(rawA);

          const parsedC = parseDate(row[2]); // 納期
          const parsedD = parseDate(row[3]); // 回答納期

          const dateOk = isWithinPeriod(parsedC, parsedD, startDate, endDate);

          if (codeOk && dateOk) {
            filtered.push(row);
          }
        }

      // 結果生成
      const resultRows = [header, ...filtered];
      const csvContent = generateCSV(resultRows);
      
      // ファイル名生成(ローカル時刻を使用)
      const formatDateForFilename = (date) => {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}${m}${d}`;
      };
      
      const today = new Date();
      const dateStr = formatDateForFilename(today);
      const startStr = formatDateForFilename(startDate);
      const endStr = formatDateForFilename(endDate);
      const outputFileName = `抽出結果_${dateStr}_${startStr}_${endStr}.csv`;

        // ダウンロード
        downloadCSV(csvContent, outputFileName);

        showMessage(
          `✓ 抽出完了\n総行数: ${data.length - 1}行\n抽出行数: ${filtered.length}行\nファイル名: ${outputFileName}`,
          'success'
        );

      } catch (error) {
        showMessage(`エラー: ${error.message}`, 'error');
        console.error(error);
      }
    }
  </script>
</body>
</html>
