const LS='invD';const LOGIC="<!DOCTYPE html><html lang=\"ja\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>計算ロジックの解説<\/title><style>\n:root{--bg:#f4f6f9;--card:#fff;--tx:#1d2433;--sub:#667085;--ln:#e3e7ee;--ac:#1f5fbf;--acbg:#e8f0fc;--bar:#7fa6e0;--gr:#18794e;--or:#b54708;--rd:#c0261b;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#12161d;--card:#1b212b;--tx:#e8ecf3;--sub:#98a2b3;--ln:#2d3644;--ac:#6ea2f0;--acbg:#1d2c47;--bar:#4a73b8;--gr:#4cc38a;--or:#f5a65b;--rd:#ff8f85;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#12161d;--card:#1b212b;--tx:#e8ecf3;--sub:#98a2b3;--ln:#2d3644;--ac:#6ea2f0;--acbg:#1d2c47;--bar:#4a73b8;--gr:#4cc38a;--or:#f5a65b;--rd:#ff8f85;color-scheme:dark}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 \"Hiragino Sans\",\"Yu Gothic\",Meiryo,system-ui,sans-serif}main{max-width:820px;margin:0 auto;padding:20px 14px 40px}\nh1{font-size:28px;font-weight:800;margin:6px 0 4px;padding-left:14px;border-left:6px solid var(--ac);line-height:1.3}.lead{color:var(--sub);margin:0 0 18px 20px}\n.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:18px;margin-bottom:16px}\nh2{font-size:18px;margin:0 0 6px;display:flex;align-items:center;gap:10px}h2 b{background:var(--ac);color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}\n.what{color:var(--sub);margin:0 0 12px}.fx{background:var(--acbg);border-radius:10px;padding:12px 14px;font-weight:700;font-size:17px;margin:10px 0;color:var(--ac)}\n.ex{border:1px dashed var(--ln);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:10px}.ex b{color:var(--ac)}\nsvg{width:100%;height:auto;display:block;margin:8px 0}svg text{fill:var(-- ss=\"e\">② 基準在庫<b>消費分＋予備<\/b><\/div><i>→<\/i><div class=\"e\">③ 最大在庫<b>基準＋MOQ<\/b><\/div><\/div>\n<div class=\"ex\"><b>この解説の計算例<\/b>　納期7日（0.23カ月）／MOQ 30個／安全係数1.65／過去12カ月の出庫は下図（月平均 627個、ばらつきσ 85）<div class=\"bars\"><div><i style=\"height:67%\"><\/i><small>10月<\/small><\/div><div><i style=\"height:74%\"><\/i><small>11月<\/small><\/div><div><i style=\"height:71%\"><\/i><small>12月<\/small><\/div><div><i style=\"height:78%\"><\/i><small>1月<\/small><\/div><div><i style=\"height:76%\"><\/i><small>2月<\/small><\/div><div><i style=\"height:79%\"><\/i><small>3月<\/small><\/div><div><i style=\"height:77%\"><\/i><small>4月<\/small><\/div><div><i style=\"height:74%\"><\/i><small>5月<\/small><\/div><div><i style=\"height:76%\"><\/i><small>6月<\/small><\/div><div><i style=\"height:95%\"><\/i><small>7月<\/small><\/div><div><i style=\"height:97%\"><\/i><small>8月<\/small><\/div><div><i style=\"height:100%\"><\/i><small>9月<\/small><\/div><\/div><\/div><\/section>\n\n<section class=\"card\"><h2><b>1<\/b>安全在庫数<\/h2><p class=\"what\">需要が急に増えても欠品しないための予備在庫です。<\/p>\n<div class=\"fx\">安全在庫 ＝ α × σ × √L<\/div>\n<div class=\"cols\"><div><h4>α　安全係数<\/h4><p>欠品をどこまで許すか。大きいほど手厚くなります。<\/p><\/div><div><h4>σ　標準偏差<\/h4><p>過去12カ月の出庫のばらつき。Excelの STDEV.S と同じです。<\/p><\/div><div><h4>L　納期（月換算）<\/h4><p>納期の日数 ÷ 30。納期が長いほど予備が増えます。<\/p><\/div><\/div>\n<svg viewBox=\"0 0 600 190\" role=\"img\" aria-label=\"需要の分布と安全在庫\"><polygon points=\"300.0,150 300.0,30.0 304.0,30.1 308.0,30.6 312.0,31.3 316.0,32.4 320.0,33.7 324.0,35.3 328.0,37.1 332.0,39.2 336.0,41.6 340.0,44.1 344.0,46.8 348.0,49.8 352.0,52.9 356.0,56.1 360.0,59.4 364.0,62.9 368.0,66.4 372.0,70.0 376.0,73.6 380.0,77.2 384.0,80.9 388.0,84.5 392.0,88.1 396.0,91.6 400.0,95.1 404.0,98.5 408.0,101.8 412.0,105.0 416.0,108.1 420.0,111.0 424.0,113.9 428.0,116.6 432.0,119.2 432.0,150\" fill=\"var(--ac)\" opacity=\".28\"/><polygon points=\"432.0,150 432.0,119.2 435.9,121.6 439.8,123.9 443.6,126.1 447.5,128.1 451.4,130.0 455.2,131.7 459.1,133.4 463.0,134.9 466.9,136.4 470.8 \/tr><\/table><\/div>\n<div class=\"ex\"><b>計算例<\/b>　1.65 × 85 × √0.233 ＝ 1.65 × 85 × 0.483 ＝ <b>68個<\/b>（小数点以下は切り上げ）<\/div><\/section>\n\n<section class=\"card\"><h2><b>2<\/b>基準在庫数<\/h2><p class=\"what\">納期の間に使う分と、予備の合計です。発注の目安になる在庫数です。<\/p>\n<div class=\"fx\">基準在庫 ＝ 月平均使用量 × L ＋ 安全在庫<\/div>\n<svg viewBox=\"0 0 520 90\" role=\"img\" aria-label=\"基準在庫の内訳\"><rect x=\"40\" y=\"30\" width=\"301\" height=\"36\" rx=\"4\" fill=\"var(--bar)\"/><rect x=\"341\" y=\"30\" width=\"139\" height=\"36\" rx=\"4\" fill=\"var(--ac)\"/><text x=\"40\" y=\"22\">納期中の消費　147個<\/text><text x=\"341\" y=\"22\" style=\"fill:var(--ac);font-weight:700\">安全在庫　68個<\/text><text x=\"40\" y=\"84\" class=\"s\">合計 ＝ 基準在庫　215個<\/text><\/svg>\n<div class=\"cols\"><div><h4>発注点方式<\/h4><p>在庫がこの数を下回ったら、すぐに発注します。<\/p><\/div><div><h4>所要量方式<\/h4><p>この数を維持するように、毎日「基準在庫 − 現在在庫 ＋ 所要量」を手配します。<\/p><\/div><\/div>\n<div class=\"ex\"><b>計算例<\/b>　627 × 0.233 ＝ 147個　→　147 ＋ 68 ＝ <b>215個<\/b><\/div><\/section>\n\n<section class=\"card\"><h2><b>3<\/b>最大在庫数<\/h2><p class=\"what\">入荷した直後に想定される、いちばん多い在庫水準です。発注点方式だけで使います。<\/p>\n<div class=\"fx\">最大在庫 ＝ 基準在庫 ＋ MOQ（最小注文数）<\/div>\n<svg viewBox=\"0 0 640 200\" role=\"img\" aria-label=\"在庫の推移イメージ\"><line x1=\"20\" y1=\"30\" x2=\"520\" y2=\"30\" stroke=\"var(--ac)\" stroke-dasharray=\"5 4\"/><line x1=\"20\" y1=\"80\" x2=\"520\" y2=\"80\" stroke=\"var(--or)\" stroke-dasharray=\"5 4\"/><line x1=\"20\" y1=\"150\" x2=\"520\" y2=\"150\" stroke=\"var(--rd)\" stroke-dasharray=\"5 4\"/><polyline points=\"30,30 130,80 270,150 270,30 370,80 510,150\" fill=\"none\" stroke=\"var(--tx)\" stroke-width=\"2.5\"/><circle cx=\"130\" cy=\"80\" r=\"5\" fill=\"var(--or)\"/><circle cx=\"270\" cy=\"30\" r=\"5\" fill=\"var(--ac)\"/><text x=\"528\" y=\"34\">最大在庫 245<\/text><text x=\"528\" y=\"84\">基準在庫 215<\/text><text x=\"528\" y=\"154\">安全在庫 68<\/text><text x=\"134\" y=\"68\" style=\"fill:var(--or);font-weight:700\">発注<\/text><text x=\"276\" y=\"48\" style=\"fill:var(--ac);font-weight:700\">入荷・補充<\/text><line x1=\"130\" y1=\"176\" x2=\"270\" y2=\"176\" stroke=\"var(--sub)\"/><text x=\"200\" y=\"194\" text-anchor=\"middle\" class=\"s\">納期（LT）<\/text><\/svg>\n<div class=\"cols\"><div><h4>発注点方式<\/h4><p>基準在庫まで減ったら発注し、納期の間に消費しながら入荷を待ちます。入荷で最大在庫まで補充されます。<\/p><\/div><div><h4>所要量方式<\/h4><p>毎日必要な分だけ手配するため、最大在庫は設定しません（表示は「設定不要」）。<\/p><\/div><\/div>\n<div class=\"ex\"><b>計算例<\/b>　215 ＋ 30 ＝ <b>245個<\/b><\/div><\/section>\n\n<section class=\"card\"><h2><b>4<\/b>需要変動係数（CV）<\/h2><p class=\"what\">出庫の安定度を見る指標です。値が小さいほど安定し、機械的な手配に向きます。<\/p>\n<div class=\"fx\">CV ＝ 標準偏差σ ÷ 月平均使用量<\/div>\n<div class=\"sc\"><span class=\"mk\" style=\"left:6.8%\">▼ 0.14<\/span><div class=\"g\">0.5以下<small>安定需要<\/small><\/div><div class=\"b\">0.5〜0.8<small>軽度の変動<\/small><\/div><div class=\"o\">0.8〜1.0<small>中度の変動<\/small><\/div><div class=\"r\">1.0以上<small>変動大<\/small><\/div><\/div>\n<div class=\"cols\"><div><h4>安定需要・軽度の変動<\/h4><p>発注点方式が向いています。軽度のときは安全係数を少し高めにします。<\/p><\/div><div><h4>中度の変動<\/h4><p>所要量方式への移行を検討します。<\/p><\/div><div><h4>変動大<\/h4><p>所要量方式、または都度手配が安全です。<\/p><\/div><\/div>\n<div class=\"ex\"><b>計算例<\/b>　85 ÷ 627 ＝ <b>0.14<\/b>　→　安定需要<\/div><\/section>\n\n<section class=\"card\"><h2><b>5<\/b>増減トレンド<\/h2><p class=\"what\">直近の需要が、ふだんより増えているか減っているかを見つける指標です。<\/p>\n<div class=\"fx\">トレンド ＝ 直近3カ月の月平均 ÷ 過去12カ月の月平均<\/div>\n<div class=\"sc\"><span class=\"mk\" style=\"left:68.1%\">▼ 1.21<\/span><div class=\"o\">0.8未満<small>減少傾向 ↘<\/small><\/div><div class=\"g\">0.8〜1.2<small>安定 →<\/small><\/div><div class=\"o\">1.2以上<small>増加傾向 ↗<\/small><\/div><\/div>\n<div class=\"cols\"><div><h4>増加傾向<\/h4><p>欠品の恐れがあります。安全係数を上げるか、基準在庫を多めにします。<\/p><\/div><div><h4>減少傾向<\/h4><p>在庫が余る恐れがあります。基準在庫の引き下げを検討します。<\/p><\/div><\/div>\n<div class=\"ex\"><b>計算例<\/b>　直近3カ月（7〜9月）の平均 760 ÷ 627 ＝ <b>1.21<\/b>　→　増加傾向 ↗<\/div><\/section>\n<\/main><\/body><\/html>\n";

const idb=()=>new Promise((ok,ng)=>{const r=indexedDB.open('invsim',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});
async function hput(h){const d=await idb();return new Promise(ok=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(h,'f');t.oncomplete=ok})}
async function hget(){const d=await idb();return new Promise(ok=>{const q=d.transaction('h').objectStore('h').get('f');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}
