<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>適正在庫シミュレーション</title>
<link rel="icon" href="../assets/icons/saboten.png" type="image/png">
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--tx:#1d2433;--sub:#667085;--ln:#e3e7ee;
  --ac:#1f5fbf;--acbg:#e8f0fc;--ok:#18794e;--wn:#b54708;--wnbg:#fff3e0;--bar:#7fa6e0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161d;--card:#1b212b;--tx:#e8ecf3;--sub:#98a2b3;--ln:#2d3644;
    --ac:#6ea2f0;--acbg:#1d2c47;--ok:#4cc38a;--wn:#f5a65b;--wnbg:#3a2a16;--bar:#4a73b8;
    color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#12161d;--card:#1b212b;--tx:#e8ecf3;--sub:#98a2b3;--ln:#2d3644;
  --ac:#6ea2f0;--acbg:#1d2c47;--ok:#4cc38a;--wn:#f5a65b;--wnbg:#3a2a16;--bar:#4a73b8;
  color-scheme:dark
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:30px;font-weight:800;letter-spacing:.04em;margin:6px 0 20px;padding-left:14px;border-left:6px solid var(--ac);line-height:1.3}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 b{background:var(--ac);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px}
label.l{display:block;font-size:12px;color:var(--sub);margin:0 0 3px}
select,input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
#item{min-height:46px;padding:10px 14px;font-size:17px;font-weight:600;letter-spacing:.02em}

/* 入力エリア */
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.row>div{min-width:0}
.f1{width:90px}
.f2{width:180px}
.f3{flex:1;min-width:230px}
.pr{margin:14px 0;padding:12px;background:var(--bg);border-radius:8px;display:grid;gap:10px}
.pr .r{display:flex;gap:20px;flex-wrap:wrap}
.pr .r div{flex:1;min-width:200px}
.pr span{display:block;font-size:12px;color:var(--sub)}
.pr p{margin:0;font-weight:600;word-break:break-all}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.info{margin:14px 0;padding:12px;background:var(--bg);border-radius:8px}
.info div{min-width:0}
.info span{display:block;font-size:12px;color:var(--sub)}
.info p{margin:0;word-break:break-all;font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:140px;border:1px solid var(--ln);border-radius:8px;padding:9px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
.seg label:has(input:checked){border-color:var(--ac);background:var(--acbg);font-weight:700}

/* 結果・指標 */
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.k{border:1px solid var(--ln);border-radius:10px;padding:14px;text-align:center}
.k span{font-size:12px;color:var(--sub)}
.k strong{display:block;font-size:30px;line-height:1.3}
.k em{font-style:normal;font-size:18px;font-weight:600;color:var(--sub);margin-left:5px}
.k.main{background:var(--acbg);border-color:var(--ac)}
.k.main strong{color:var(--ac)}
.k.na strong{font-size:18px;color:var(--sub);padding:9px 0}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--acbg);color:var(--ac)}
.tag.w{background:var(--wnbg);color:var(--wn)}
.ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.ind>div{border:1px solid var(--ln);border-radius:10px;padding:12px}
.ind span{font-size:12px;color:var(--sub);display:block}
.ind strong{font-size:20px;margin-right:6px}
.adv{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--wnbg);color:var(--wn);font-size:14px}
.adv.g{display:block}
.adv.ok{background:var(--acbg);color:var(--ac)}

/* グラフ */
.bars{display:flex;gap:4px;align-items:flex-end;height:130px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;min-width:0}
.bars i{display:block;width:60%;background:var(--bar);border-radius:3px 3px 0 0}
.bars small{font-size:10px;color:var(--sub);text-align:center;line-height:1.2}
.bars .yy{font-size:9px}

/* データ取得バー */
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px}
.bar .t{flex:1;min-width:200px}
.bar .t b{font-size:14px}
.um{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.um label{padding:6px 14px;cursor:pointer;font-size:13px}
.um label:has(input:checked){background:var(--ac);color:#fff;font-weight:700}
.um input{display:none}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.s{background:var(--card);color:var(--ac)}
.btn.sm{padding:3px 10px;font-size:12px}
.err{color:var(--wn)}
[hidden]{display:none!important}
.sp{width:14px;height:14px;border:2px solid var(--ln);border-top-color:var(--ac);border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.ld{width:100%;font-weight:700;color:var(--ac)}
.pl{width:100%;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pl a{color:var(--ac);word-break:break-all}
.pn{width:100%;display:flex;gap:12px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--ln);padding-top:12px}

/* ヘッダー・ロジック解説オーバーレイ */
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 20px}
.hd h1{margin:0}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.6);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.ovb{position:relative;max-width:860px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column}
.ovb .btn{margin:10px 14px;align-self:flex-end}
#fr{flex:1;width:100%;border:0}

/* 判定色 */
.tag.g{background:light-dark(#e3f4ea,#17382a);color:light-dark(#18794e,#4cc38a)}
.tag.o{background:light-dark(#fff1dc,#3a2a16);color:light-dark(#b54708,#f5a65b)}
.tag.r{background:light-dark(#fde4e1,#471d1a);color:light-dark(#c0261b,#ff8f85)}
.adv.g{background:light-dark(#e3f4ea,#17382a);color:light-dark(#18794e,#4cc38a)}
.adv.r{background:light-dark(#fde4e1,#471d1a);color:light-dark(#c0261b,#ff8f85)}
h3{font-size:13px;margin:16px 0 0;color:var(--sub)}
.note{font-size:13px;color:var(--sub);margin-top:6px}
</style>
</head>
<body>
<main>

<div class="hd">
  <h1>適正在庫シミュレーション</h1>
  <button class="btn s" id="bLg">計算ロジックを見る</button>
</div>

<div class="ov" id="ov" hidden>
  <div class="ovb">
    <button class="btn" id="ovx">✕ 閉じる</button>
    <iframe id="fr" title="計算ロジックの解説"></iframe>
  </div>
</div>

<!-- データ取得バー -->
<section class="card bar">
  <div class="t" id="barT" style="cursor:pointer" title="クリックでデータ取得を開く">
    <b>品目状況一覧</b>　<span id="st">内蔵データ</span> <span style="color:var(--sub)">▾</span>
    <span id="fl" class="err" style="font-size:13px;font-weight:700;margin-left:8px" hidden></span>
  </div>
  <div class="pn" id="pn" hidden>
    <div class="um">
      <label><input type="radio" name="um" value="m" checked>手動</label>
      <label><input type="radio" name="um" value="a">自動</label>
    </div>
    <button class="btn" id="bUp">CSVを読み込んで更新</button>
    <button class="btn s" id="bCh" hidden>登録先を変更</button>
    <input type="file" id="fi" accept=".csv,.CSV,text/csv" hidden>
    <div class="note" id="sd" style="flex:1;min-width:200px"></div>
    <div class="ld" id="ld" hidden><span class="sp"></span><span id="ldt">読み込み中…</span><button class="btn s sm" id="bCan" style="margin-left:12px">キャンセル</button></div>
    <div class="pl" id="pl" hidden></div>
  </div>
</section>

<!-- 入力 -->
<section class="card">
  <label class="l">品目コード</label>
  <input type="text" id="item" list="codes" autocomplete="off" placeholder="品目コードを入力">
  <datalist id="codes"></datalist>
  <div class="pr">
    <div class="r">
      <div><span>品名</span><p id="iN"></p></div>
      <div><span>仕様</span><p id="iS"></p></div>
    </div>
    <div class="r">
      <div><span>メーカー</span><p id="iK"></p></div>
      <div><span>手配先</span><p id="iT"></p></div>
    </div>
    <div class="r">
      <div><span>在庫評価単価</span><p id="iP"></p></div>
    </div>
  </div>
  <div class="row">
    <div class="f1">
      <label class="l">納期（LT）日</label>
      <input type="number" id="lt" min="1">
      <div class="note" id="ltm"></div>
    </div>
    <div class="f2">
      <label class="l">最小注文数（MOQ）<span id="mu" style="display:inline"></span></label>
      <input type="number" id="moq" min="1">
    </div>
    <div class="f3">
      <label class="l">安全係数（α）</label>
      <select id="al">
        <option value="2.33">許容率 1%　欠品すると生産ラインが即停止する主要部品</option>
        <option value="2.06">許容率 2%　調達が難しく代替がきかない部品</option>
        <option value="1.65" selected>許容率 5%　通常の標準部品・資材（初期値）</option>
        <option value="1.29">許容率10%　汎用品・即時代替手配が可能な品目</option>
      </select>
    </div>
  </div>
  <label class="l" style="margin-top:14px">手配方式</label>
  <div class="seg">
    <label><input type="radio" name="md" value="req" checked>所要量方式</label>
    <label><input type="radio" name="md" value="op">発注点方式</label>
  </div>
</section>

<!-- 結果 -->
<section class="card">
  <h2>適正在庫 提案・計算結果 <span class="tag" id="mt"></span></h2>
  <div id="res"></div>
</section>

<section class="card">
  <h2>参考指標・トレンド分析</h2>
  <div id="ref"></div>
</section>

</main>

/* 年度（4月始まり）。月・年度ラベルは今日の日付から自動生成 */
const MON_END=1;  // 1＝CSVの12カ月の末尾が先月 / 0＝当月
const YR_END=1;   // 1＝5年の末尾が昨年 / 0＝今年
const fyOf=(y,mo)=>mo>=3?y:y-1;   // mo: 0=1月 … 3=4月
function monthLabels(){
  const t=new Date(), a=[];
  for(let k=11+MON_END;k>=MON_END;k--){
    const x=new Date(t.getFullYear(),t.getMonth()-k,1);
    a.push((x.getMonth()+1)+'月<br><span class="yy">('+fyOf(x.getFullYear(),x.getMonth())+')</span>');
  }
  return a;
}
function yearLabels(){
  const y=new Date().getFullYear()-YR_END, a=[];
  for(let k=4;k>=0;k--)a.push(String(y-k));
  return a;
}
let ci=0;

let IDX=new Map(), UC=[];
function reindex(){
  UC=new Array(D.length);
  IDX=new Map();
  for(let i=0;i<D.length;i++){
    const u=D[i].c.toUpperCase();
    UC[i]=u;
    if(!IDX.has(u))IDX.set(u,i);
  }
}
reindex();
function fillCodes(q){
  const v=(q||'').trim().toUpperCase(), a=[];
  for(let i=0;i<D.length;i++){
    if(!v||UC[i].includes(v)){a.push(D[i]);if(a.length>=100)break}
  }
  $('codes').innerHTML=a.map(d=>`<option value="${d.c}">${d.n}</option>`).join('');
}
fillCodes();

function bars(a,l,c){
  const m=Math.max(...a,1);
  return `<div class="bars ${c}">`
    +a.map((v,i)=>`<div title="${l[i].replace(/<[^>]*>/g,' ')} ${v}">${fmt(v)}<i style="height:${Math.max(v/m*85,1)}%"></i><small>${l[i]}</small></div>`).join('')
    +'</div>';
}

/* ============ 計算・表示 ============ */
function run(){
  const d=D[ci], u=d.u;
  $('mu').textContent=u;
  $('iN').textContent=d.n;
  $('iS').textContent=d.s||'－';
  $('iK').textContent=d.k||'－';
  $('iT').textContent=d.t||'－';
  $('iP').textContent=fmt(d.p)+'円';

  const lt=Math.max(+$('lt').value||0,0),
        moq=Math.max(+$('moq').value||0,0),
        al=+$('al').value,
        L=lt/30;
        $('ltm').textContent = lt>0 ? '= '+L.toFixed(2)+'カ月' : '';

  // 月平均・標準偏差（STDEV.S）
  const m=d.m,
        tot=m.reduce((a,b)=>a+b,0),
        avg=tot/12,
        sd=Math.sqrt(m.reduce((a,b)=>a+(b-avg)**2,0)/11);

  // 安全在庫・基準在庫・最大在庫
  const ss=Math.ceil(al*sd*Math.sqrt(L)),
        lc=Math.ceil(avg*L),
        base=lc+ss,
        mx=base+moq,
        op=document.querySelector('[name=md]:checked').value==='op';
  $('mt').textContent=op?'発注点方式':'所要量方式';

  const k=(t,v,u,c)=>`<div class="k ${c||''}"><span>${t}</span><strong>${v}<em>${u}</em></strong></div>`;
  $('res').innerHTML='<div class="res">'
    +(op
      ? k('発注点（基準在庫数）',fmt(base),u,'main')
        +k('最大在庫数（MAX）',moq>0?fmt(mx):'MOQを入力',moq>0?u:'',moq>0?'':'na')
        +k('うち安全在庫数',fmt(ss),u)
      : k('基準在庫数（目標維持在庫）',fmt(base),u,'main')
        +k('最大在庫数（MAX）','設定不要','','na')
        +k('うち安全在庫数',fmt(ss),u))
    +'</div>'
    +`<div class="note">LT内消費 ${fmt(lc)}${u} ＋ 安全在庫 ${fmt(ss)}${u}${op&&moq>0?' ／ MAX＝基準在庫＋MOQ '+fmt(moq)+u:''}</div>`;
  if(!(lt>0)){
    $('res').innerHTML='<div class="note" style="font-size:14px">納期（LT）を入力すると、計算結果が表示されます。</div>';
  }

  // CV・トレンド
  const cv=avg>0?sd/avg:null,
        tr=avg>0?(m[9]+m[10]+m[11])/3/avg:null;
  const cc=cv===null?'':cv<=.5?'g':cv<.8?'':cv<1?'o':'r',
        tc=tr===null?'':tr>=1.5||tr<.5?'r':tr>=1.2||tr<.8?'o':'g';

  let cl,cm,cadv;
  if(cv===null){cl='判定不可';cm='使用実績がありません';cadv=''}
  else if(cv<=.5){
    cl='安定需要';cm='安定需要 ⇒ 適した方式：発注点';
    cadv='毎月の使用量のブレが小さいため、欠品や過剰在庫のリスクが少なく安心して運用できます。';
  }else if(cv<.8){
    cl='軽度の変動';cm='適した方式：発注点';
    cadv='毎月の使用量に軽度の変動があります。安全係数を少し高めに設定するか、定期的な基準見直しを推奨します。';
  }else if(cv<1){
    cl='中度の変動';cm='適した方式：所要量検討';
    cadv='毎月の使用量に中度の変動があります。定期的に需要トレンドをチェックする必要があります。';
  }else{
    cl='変動大';cm='適した発注方式：所要量';
    cadv='毎月の使用量の変動が大きいため、過剰在庫や欠品のリスクに注意してください。';
  }

  let tl,adv;
  if(tr===null){
    tl='判定不可';
    adv='使用実績がないため、手配方式・在庫水準は実績が出てから見直してください。';
  }else if(tr>=1.2){
    tl='増加傾向 ↗';
    adv='直近３カ月の平均使用量は過去１年平均に比べて増加しています。安全係数の引き上げや基準在庫のプラス補正を検討ください。';
  }else if(tr<.8){
    tl='減少傾向 ↘';
    adv='直近３カ月の平均使用量は過去１年平均に比べて減少しています。過剰在庫を防ぐため基準在庫のマイナス補正を検討ください。';
  }else{
    tl='安定 →';
    adv='直近３カ月の平均使用量は過去１年平均と同水準で安定しています。';
  }

  $('ref').innerHTML=
    `<div class="ind">
      <div><span>年間使用量 ／ 月平均</span><strong>${fmt(tot)}${u}</strong>／ 月平均 ${fmt(avg)}${u}</div>
      <div><span>需要変動（CV）</span><strong>${cl}</strong><i class="tag ${cc}" style="font-style:normal">${cv===null?'－':cv.toFixed(2)}</i><div class="note">${cm}</div></div>
      <div><span>増減トレンド</span><strong>${tl}</strong><i class="tag ${tc}" style="font-style:normal">${tr===null?'－':tr.toFixed(2)}</i></div>
    </div>
    ${cadv?`<div class="adv ${cc||'ok'}"><b>【需要変動】</b>${cadv}</div>`:''}
    <div class="adv ${tc||'ok'}"><b>【増減トレンド】</b>${adv}</div>
    <h3>過去12カ月の出庫推移（${u}／カッコ内は年度）</h3>${bars(m,monthLabels(),'')}
    <h3>過去5年度の出庫推移（${u}／年度）</h3>${bars(d.y,yearLabels(),'y')}`;
}

function pick(){
  $('lt').value='';
  $('moq').value='';
  run();
}

$('item').oninput=()=>{
  const v=$('item').value.trim().toUpperCase(),
        i=IDX.has(v)?IDX.get(v):-1;
  if(i>=0){ci=i;pick()}
  fillCodes($('item').value);
};
$('item').onfocus=()=>{$('item').select();fillCodes('')};
['lt','moq','al'].forEach(i=>$(i).oninput=run);
document.querySelectorAll('[name=md]').forEach(r=>r.onchange=run);

/* ============ CSV解析 ============ */
function dec(b){
  let t=new TextDecoder('shift_jis').decode(b);
  if(!t.includes('品目コード')){
    const u=new TextDecoder('utf-8').decode(b);
    if(u.includes('品目コード'))t=u;
  }
  return t;
}

/* ファイル読込（共有フォルダ経由だと遅い）→ 解析。所要時間を計測して返す */
let cancelled=false, rd=null;
$('bCan').onclick=()=>{
  cancelled=true;
  $('ldt').textContent='キャンセル中…';
  if(rd)rd.cancel().catch(()=>{});
};
const emsg=e=>e&&e.message==='CANCEL'?'キャンセルしました（データは前回のまま）':'読込失敗：'+(e&&e.message);
async function readFile(f){
  const chunks=[];
  let got=0,tp=0;
  rd=f.stream().getReader();
  const r0=rd;
  try{
    for(;;){
      if(cancelled)break;
      const {done,value}=await r0.read();
      if(done)break;
      chunks.push(value);
      got+=value.length;
      if(performance.now()-tp>200){
        tp=performance.now();
        $('ldt').textContent='ファイル読込中… '+(got/1048576).toFixed(0)+' / '+(f.size/1048576).toFixed(0)+'MB';
      }
    }
  }finally{
    rd=null;
    try{await r0.cancel()}catch(e){}
  }
  if(cancelled)throw new Error('CANCEL');
  const buf=new Uint8Array(got);
  let o=0;
  for(const c of chunks){buf.set(c,o);o+=c.length}
  return buf;
}
/* ファイル読込（共有フォルダ経由だと遅い）→ 解析。所要時間を計測して返す */
async function readItems(f){
  cancelled=false;
  const t0=performance.now();
  $('ldt').textContent='ファイル読込中…（共有フォルダは時間がかかります）';
  const buf=await readFile(f);
  const t1=performance.now();
  $('ldt').textContent='解析中…';
  await new Promise(r=>setTimeout(r,30));
  const items=await parseItems(dec(buf),prog);
  return {items,read:t1-t0,parse:performance.now()-t1,mb:buf.length/1048576};
}
const sec=ms=>(ms/1000).toFixed(1)+'秒';

/* CSV → 品目配列（数十万行でも固まらないよう、一定時間ごとに画面へ制御を戻し進捗を表示） */
async function parseItems(t,prog){
  const out=[], L=t.length;
  const n=v=>{const x=parseFloat(String(v==null?'':v).replace(/,/g,''));return isNaN(x)?0:Math.round(x)},
        s=v=>(v||'').trim();
  let i=0,row=[],first=true,rows=0,tm=Date.now();
  const endRow=async()=>{
    const r=row; row=[];
    if(first){
      if((r[1]||'').trim()!=='品目コード')throw new Error('品目状況一覧のCSVではありません');
      first=false;
    }else if(r.length>35&&s(r[1])&&!s(r[0])){
      const m=new Array(12), y=new Array(5);
      for(let k=0;k<12;k++)m[k]=n(r[34-k]);
      for(let k=0;k<5;k++)y[k]=n(r[39-k]);
      out.push({c:s(r[1]),n:s(r[2]),s:s(r[3]),u:s(r[4])||'個',t:s(r[7]),p:n(r[11]),k:s(r[13]),lt:n(r[15]),moq:n(r[16]),m,y});
    }
    rows++;
    if(rows%1000===0&&Date.now()-tm>60){
      if(prog)prog(rows,i/L);
      await new Promise(r=>setTimeout(r,0));
      if(cancelled)throw new Error('CANCEL');
      tm=Date.now();
    }
  };
  while(i<L){
    let f;
    if(t.charCodeAt(i)===34){
      i++; f='';
      for(;;){
        const j=t.indexOf('"',i);
        if(j<0){f+=t.slice(i);i=L;break}
        f+=t.slice(i,j);
        if(t.charCodeAt(j+1)===34){f+='"';i=j+2}
        else{i=j+1;break}
      }
    }else{
      let j=i;
      while(j<L){const c=t.charCodeAt(j);if(c===44||c===10||c===13)break;j++}
      f=t.slice(i,j); i=j;
    }
    row.push(f);
    const c=t.charCodeAt(i);
    if(c===44){i++;if(i>=L)row.push('')}
    else if(c===10||c===13){
      if(c===13&&t.charCodeAt(i+1)===10)i++;
      i++;
      await endRow();
    }
  }
  if(row.length&&!(row.length===1&&row[0]===''))await endRow();
  if(first)throw new Error('品目状況一覧のCSVではありません');
  return out;
}
const prog=(r,p)=>{$('ldt').textContent='読み込み中… '+fmt(r)+'行（'+Math.round(p*100)+'%）'};

let fromSaved=false;
function sameItem(a,b){
  if(a.n!==b.n||a.s!==b.s||a.u!==b.u||a.t!==b.t||a.k!==b.k||a.p!==b.p||a.lt!==b.lt||a.moq!==b.moq)return false;
  for(let i=0;i<12;i++)if(a.m[i]!==b.m[i])return false;
  for(let i=0;i<5;i++)if(a.y[i]!==b.y[i])return false;
  return true;
}
function diffItems(o,nw){
  const om=new Map();
  for(const d of o)om.set(d.c,d);
  let add=0,chg=0;
  for(const d of nw){
    const e=om.get(d.c);
    if(!e)add++;
    else if(!sameItem(e,d))chg++;
  }
  return {add,chg,del:Math.max(o.length-(nw.length-add),0)};
}
/* 新しいデータを前回保存分と比較し、変更があるときだけ入れ替え・保存する */
function setData(a,info,mod,tm){
  if(!a.length)throw new Error('品目が0件です');
  const dif=fromSaved?diffItems(D,a):null,
        same=!!dif&&!dif.add&&!dif.chg&&!dif.del;
  const dtx=dif?(same?'　［データに変更なし］':'　［変更'+fmt(dif.chg)+'・追加'+fmt(dif.add)+'・削除'+fmt(dif.del)+'件］'):'';
  const ttx=ex=>tm?'　［'+Math.round(tm.mb)+'MB 読込'+sec(tm.read)+'／解析'+sec(tm.parse)+ex+'］':'';
  if(!same){
    const cur=D[ci]&&D[ci].c;
    D=a;
    reindex();
    fillCodes('');
    const cu=cur?cur.toUpperCase():'',
          i=IDX.has(cu)?IDX.get(cu):-1;
    ci=i>=0?i:Math.max(D.findIndex(d=>d.m.some(v=>v>0)),0);
    const lv=$('lt').value, mv=$('moq').value;
    $('item').value=D[ci].c;
    pick();
    if(i>=0){$('lt').value=lv;$('moq').value=mv;run()}
  }
  fromSaved=true;
  setSt(info);
  $('sd').textContent=info+dtx+ttx(same?'':'／保存中…');
  const ts=performance.now();
  (same?Promise.resolve():dput({a:D}))
    .then(()=>dsetK('meta',{info,mod:mod||0}))
    .then(()=>{$('sd').textContent=info+dtx+ttx(same?'':'／保存'+sec(performance.now()-ts))})
    .catch(()=>{$('sd').textContent+='（※端末への保存に失敗）'});
}

/* ============ 自動読み込み（ファイルハンドル） ============ */
const idb=()=>new Promise((ok,ng)=>{
  const r=indexedDB.open('invsim',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('h');
  r.onsuccess=()=>ok(r.result);
  r.onerror=()=>ng(r.error);
});
async function hput(h){
  const d=await idb();
  return new Promise(ok=>{
    const t=d.transaction('h','readwrite');
    t.objectStore('h').put(h,'f');
    t.oncomplete=ok;
  });
}
async function hget(){
  const d=await idb();
  return new Promise(ok=>{
    const q=d.transaction('h').objectStore('h').get('f');
    q.onsuccess=()=>ok(q.result);
    q.onerror=()=>ok(null);
  });
}

/* 取込データの保存（IndexedDB：容量が大きく、次に開いたときも残る） */
async function dsetK(k,v){
  const d=await idb();
  return new Promise((ok,ng)=>{
    const t=d.transaction('h','readwrite');
    t.objectStore('h').put(v,k);
    t.oncomplete=ok;
    t.onerror=()=>ng(t.error);
    t.onabort=()=>ng(t.error);
  });
}
async function dgetK(k){
  const d=await idb();
  return new Promise(ok=>{
    const q=d.transaction('h').objectStore('h').get(k);
    q.onsuccess=()=>ok(q.result);
    q.onerror=()=>ok(null);
  });
}
const dput=v=>dsetK('d',v), dget=()=>dgetK('d');

let fh=null, lastMod=0, timer=null;

/* ---- 自動実行の成功／失敗の記録 ----
   invLast : 最後に成功した日時
   invTry  : {d:日付, n:本日の自動失敗回数} */
const MAXTRY=10;
const AUTOHOUR=12; // 開いたままの場合に自動更新を確認する時刻（時）
const dayKey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function lastOk(){let l=0;try{l=+localStorage.getItem('invLast')||0}catch(e){}return l}
function getTry(){
  try{
    const o=JSON.parse(localStorage.getItem('invTry'));
    if(o&&o.d===dayKey(new Date()))return o;
  }catch(e){}
  return {d:dayKey(new Date()),n:0};
}
function putTry(o){try{localStorage.setItem('invTry',JSON.stringify(o))}catch(e){}}
function markOk(){
  try{localStorage.setItem('invLast',Date.now())}catch(e){}
  putTry({d:dayKey(new Date()),n:0});
  showFail();
}
function showFail(){
  const o=getTry(), el=$('fl');
  if(!o.n){el.hidden=true;return}
  const l=lastOk(), ld=l?new Date(l).toLocaleDateString('ja-JP'):'なし';
  el.textContent=o.c
    ?'⚠ 自動更新をキャンセルしました　最終成功：'+ld+'　手動で更新できます'
    :'⚠ 自動読込に失敗（'+o.n+'/'+MAXTRY+'回）　最終成功：'+ld
      +(o.n>=MAXTRY?'　本日の自動実行は停止。手動で更新してください':'');
  el.hidden=false;
}

/* force:手動操作（更新の有無にかかわらず読み直す） / quiet:自動実行
   成功→true、失敗→false、キャンセル→'cancel' */
async function loadFH(force,quiet){
  try{
    const f=await fh.getFile();   // ここでは更新日時など情報だけ取得（中身は読まない）
    if(!force&&f.lastModified===lastMod){
      // 前回取込時から更新されていなければ、中身は読まない（共有フォルダ対策）
      $('sd').textContent='前回の取込から共有CSVの更新なし（'+new Date(f.lastModified).toLocaleString('ja-JP')+'）。再読込は省略しました';
      markOk();
      return true;
    }
    busy(true);
    const r=await readItems(f);
    lastMod=f.lastModified;
    setData(
      r.items,
      `✅ 読み込み完了 ${now()}　${f.name}　${r.items.length}件（ファイル更新 ${new Date(f.lastModified).toLocaleString('ja-JP')}）`,
      f.lastModified,r
    );
    showPath();
    markOk();
    return true;
  }catch(e){
    if(e&&e.message==='CANCEL'){
      setSt(emsg(e),1,true);
      putTry({d:dayKey(new Date()),n:MAXTRY,c:1});   // キャンセル後は本日の自動実行を止める
      showFail();
      return 'cancel';
    }
    setSt(emsg(e),1,quiet);
    return false;
  }finally{
    busy(false);
  }
}

/* 自動更新（自動モード・登録済みのとき）
   ・ページを開いたとき／開いたまま正午を過ぎたときに実行
   ・共有CSVの更新日時が前回取込時と同じなら、中身は読まない
   ・失敗したら1分後に再試行、本日10回失敗したら諦める（同日の再実行は手動）
   ・キャンセルしたら本日の自動実行は停止 */
let running=false;
async function autoRun(){
  if(running||!auto()||!fh)return;
  if(getTry().n>=MAXTRY)return;
  running=true;
  let ok=false;
  try{
    if((await fh.queryPermission({mode:'read'}))==='granted'){
      ok=await loadFH(false,true);
    }else{
      // 許可が必要（クリック操作が必要）。失敗回数には数えない
      $('sd').textContent='共有CSVへのアクセス許可が必要です。「今すぐ更新」を押してください';
      $('pn').hidden=false;
      ok='perm';
    }
  }catch(e){
    setSt(emsg(e),1,true);
  }
  if(!ok){
    const o2=getTry();
    o2.n++;
    putTry(o2);
    showFail();
  }
  running=false;
}
/* 開いたままの場合：毎日 AUTOHOUR 時以降、未確認なら1回確認 */
async function daily(){
  if(!auto()||!fh)return;
  const n=new Date(),
        t=new Date(n.getFullYear(),n.getMonth(),n.getDate(),AUTOHOUR).getTime();
  if(n.getTime()<t||lastOk()>=t)return;
  await autoRun();
}

function startAuto(){
  clearInterval(timer);
  timer=setInterval(daily,60000);
}

async function ready(){
  if(!fh)return false;
  return (await fh.queryPermission({mode:'read'}))==='granted'
      || (await fh.requestPermission({mode:'read'}))==='granted';
}

}

  if(auto()&&fh){
    try{
      if((await fh.queryPermission({mode:'read'}))==='granted'){
        await loadFH(false);
        startAuto();
      }
    }catch(e){}
  }
});

$('bCh').onclick=async()=>{
  try{
    const[x]=await showOpenFilePicker({types:[{description:'CSV',accept:{'text/csv':['.csv','.CSV']}}]});
    fh=x;
    lastMod=0;
    await hput(x);
    if(await ready()){
      await loadFH(true);
      startAuto();
    }
    ui();
  }catch(e){
    if(e.name!=='AbortError')setSt(NOAUTO,1);
  }
};

/* ============ 起動時 ============ */
async function init(){
  $('st').textContent='保存データを復元中…';
  // 前回取り込んだデータを復元（なければ内蔵データ）
  try{
    const sv=await dget(), mt=await dgetK('meta');
    if(sv&&sv.a&&sv.a.length){
      D=sv.a;
      stTxt=(mt&&mt.info)||sv.info;
      lastMod=(mt?mt.mod:sv.mod)||0;
      fromSaved=true;
    }
  }catch(e){}
  try{localStorage.removeItem(LS)}catch(e){}
  reindex();
  fillCodes('');
  ci=Math.max(D.findIndex(d=>d.m.some(v=>v>0)),0);
  $('item').value=D[ci].c;
  pick();
  setSt(stTxt);
  ui();
  showFail();
  // 自動モードの復元（データ復元のあとに開始）
  try{
    if(localStorage.getItem('invMode')==='a'){
      document.querySelector('[name=um][value=a]').checked=true;
      fh=await hget();
      ui();
      if(fh){
        if((await fh.queryPermission({mode:'read'}))==='granted')startAuto();
        autoRun();   // 開いたタイミングで、共有CSVが更新されていれば自動更新
      }
    }
  }catch(e){}
}
init();
</script>
